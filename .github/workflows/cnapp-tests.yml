name: CNAPP Module Tests

on:
  pull_request:
    paths:
      - 'api/src/backend/api/attack_paths/**'
      - 'api/src/backend/api/cwpp/**'
      - 'api/src/backend/api/ciem/**'
      - 'api/src/backend/api/dspm/**'
      - 'api/src/backend/api/cdr/**'
      - 'api/src/backend/tasks/jobs/cwpp/**'
      - 'api/src/backend/tasks/jobs/ciem/**'
      - 'api/src/backend/tasks/jobs/dspm/**'
      - 'api/src/backend/tasks/jobs/cdr/**'
      - 'api/src/backend/tasks/jobs/integrations/**'
      - 'tests/cnapp/**'
  push:
    branches: [main]
    paths:
      - 'api/src/backend/api/attack_paths/**'
      - 'api/src/backend/tasks/jobs/cwpp/**'
      - 'api/src/backend/tasks/jobs/ciem/**'
      - 'api/src/backend/tasks/jobs/dspm/**'
      - 'api/src/backend/tasks/jobs/cdr/**'
      - 'tests/cnapp/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          cd api && uv sync --frozen

      - name: Run CNAPP unit tests
        run: |
          cd api && uv run pytest ../tests/cnapp/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint CNAPP modules
        run: |
          pip install ruff
          ruff check api/src/backend/api/attack_paths/ \
                     api/src/backend/api/cwpp/ \
                     api/src/backend/api/ciem/ \
                     api/src/backend/api/dspm/ \
                     api/src/backend/api/cdr/ \
                     api/src/backend/tasks/jobs/cwpp/ \
                     api/src/backend/tasks/jobs/ciem/ \
                     api/src/backend/tasks/jobs/dspm/ \
                     api/src/backend/tasks/jobs/cdr/ \
                     api/src/backend/tasks/jobs/integrations/
