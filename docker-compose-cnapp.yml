# Prowler CNAPP Full Stack
# Usage: docker compose -f docker-compose.yml -f docker-compose-cnapp.yml up -d

services:
  # Scanner worker with Trivy/TruffleHog
  scanner-worker:
    build:
      context: .
      dockerfile: kubernetes/Dockerfile.scanner
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prowler}:${POSTGRES_PASSWORD:-prowler}@postgres:5432/${POSTGRES_DB:-prowler}
      - VALKEY_URL=redis://valkey:6379/0
      - NEO4J_HOST=neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
      - CELERY_BROKER_URL=redis://valkey:6379/0
    depends_on:
      - postgres
      - valkey
      - neo4j
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped

  # CDR event processor (polls SQS/EventHub)
  cdr-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: celery -A config.celery worker -Q cdr -l info -c 1
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prowler}:${POSTGRES_PASSWORD:-prowler}@postgres:5432/${POSTGRES_DB:-prowler}
      - VALKEY_URL=redis://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
    depends_on:
      - postgres
      - valkey
    restart: unless-stopped

  # Prometheus for CNAPP metrics
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./kubernetes/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    depends_on:
      - prometheus
    restart: unless-stopped
