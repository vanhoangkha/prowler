apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prowler.fullname" . }}-env
  labels:
    {{- include "prowler.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:$(DB_PASSWORD)@{{ include "prowler.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
  VALKEY_URL: "redis://{{ include "prowler.fullname" . }}-valkey-master:6379/0"
  NEO4J_HOST: "{{ include "prowler.fullname" . }}-neo4j"
  NEO4J_PORT: "7687"
  DJANGO_SECRET_KEY: "change-me-in-production"
  DJANGO_SETTINGS_MODULE: "config.settings.production"
