global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prowler-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics

  - job_name: 'prowler-worker'
    static_configs:
      - targets: ['worker:9100']

  - job_name: 'prowler-scanner'
    static_configs:
      - targets: ['scanner-worker:9100']

  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:2004']
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']
